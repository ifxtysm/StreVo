<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreVo - Video Sharing Platform</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>


    <header class="navbar">

        <div class="nav-left">

            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="logo">
                <i class="fa-solid fa-play"></i>
                <span>StreVo</span>
            </div>

        </div>

        <div class="search-container">

            <input type="text" placeholder="Search videos">

            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

        <div class="nav-right">

            <button>
                <i class="fa-solid fa-upload"></i>
            </button>

            <button>
                <i class="fa-regular fa-bell"></i>
            </button>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3VishuxAgK42Rdzxi12dg12KSM2t3odeBpVoUdaY9dw&s=10" alt="User">

        </div>

    </header>


    <aside class="sidebar">

        <ul>

            <li class="active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </li>

            <li>
                <i class="fa-solid fa-fire"></i>
                <span>Trending</span>
            </li>

            <li>
                <i class="fa-solid fa-video"></i>
                <span>Shorts</span>
            </li>

            <li>
                <i class="fa-solid fa-tv"></i>
                <span>Subscriptions</span>
            </li>

            <hr>

            <li>
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>History</span>
            </li>

            <li>
                <i class="fa-solid fa-bookmark"></i>
                <span>Watch Later</span>
            </li>

            <li>
                <i class="fa-solid fa-thumbs-up"></i>
                <span>Liked Videos</span>
            </li>

        </ul>

    </aside>

    <main class="main-content">

        <section class="hero">

            <div class="hero-content">

                <h1>Discover Amazing Videos</h1>

                <p>
                    Watch trending content, learn new skills,
                    and connect with creators from around the world.
                </p>

                <button>
                    Explore Now
                </button>

            </div>

        </section>


        <section class="categories">

            <button class="active">All</button>
            <button>Gaming</button>
            <button>Music</button>
            <button>Technology</button>
            <button>Sports</button>
            <button>Education</button>
            <button>Travel</button>
            <button>Lifestyle</button>

        </section>


        <section class="videos" id="videosContainer">

</section>

            
    </main>

    <script src="main.js"></script>
    <script src="home.js"></script>

</body>

</html>
