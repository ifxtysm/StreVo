<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch | StreVo</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="watch.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="navbar">

    <div class="nav-left">

        <button class="menu-btn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="logo">
            <i class="fa-solid fa-play"></i>
            <span>StreVo</span>
        </div>

    </div>

    <div class="search-container">

        <input type="text" placeholder="Search videos">

        <button>
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

    </div>

    <div class="nav-right">

        <button>
            <i class="fa-solid fa-upload"></i>
        </button>

        <button>
            <i class="fa-regular fa-bell"></i>
        </button>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3VishuxAgK42Rdzxi12dg12KSM2t3odeBpVoUdaY9dw&s=10" alt="User">

    </div>

</header>

<div class="watch-container">

    <section class="video-section">

       <video id="videoPlayer" controls>

    <source id="videoSource" src="" type="video/mp4">

</video>
        <h2 id="videoTitle"></h2>

        <div class="video-meta">

    <span id="videoViews"></span>

</div>

        <div class="video-actions">

            <button>
                <i class="fa-solid fa-thumbs-up"></i>
                25K
            </button>

            <button>
                <i class="fa-solid fa-thumbs-down"></i>
                320
            </button>

            <button>
                <i class="fa-solid fa-share"></i>
                Share
            </button>

            <button>
                <i class="fa-solid fa-bookmark"></i>
                Save
            </button>

        </div>

        <div class="channel-box">

            <div class="channel-info">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxaH4uJAuMyyDrdQKXVj0sz9hx706mSm1ZvOi-H84fSA&s=10">

                <div>

                    <h3 id="channelName"></h3>

                    <span>
                        1.2M Subscribers
                    </span>

                </div>

            </div>

            <button class="subscribe">

                Subscribe

            </button>

        </div>

        <div class="description">

            <h3>Description</h3>

          <p id="videoDescription"></p>

        </div>

        <div class="comments">

            <h3>
                Comments
            </h3>

            <textarea
                placeholder="Add a comment..."></textarea>

            <button>

                Post Comment

            </button>

            <div class="comment">

                <img src="https://i.pravatar.cc/50?img=25">

                <div>

                    <h4>
                        Emilly Watson
                    </h4>

                    <p>
                        She spennds a lot of time with friends and that's nice to see. I like her vlogs.
                    </p>

                </div>

            </div>

            <div class="comment">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDcGRNtaBlbgFHL-bcu4YganYASvPHXpcRn9YGeV-sfA&s=10">

                <div>

                    <h4>
                    Amber Christ 
                    </h4>

                    <p>
                 Love her fashion sense and the way she presents her daily life. It's very relatable and inspiring.
                    </p>

                </div>

            </div>

        </div>

    </section>

    <aside class="related">

    <h3>Related Videos</h3>

    <div id="relatedVideos"></div>

</aside>

</div>

<script src="watch.js"></script>

</body>

</html>
